[package]
name = "herdr-fff"
version = "0.1.0"
edition = "2021"
description = "fff's file search in the Herdr desktop app"
license = "MIT"
repository = "https://github.com/Shyrogan/herdr-fff"

[dependencies]
anyhow = "1"
fff-search = "0.10.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
strip = true
